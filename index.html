<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VICE PROTOCOL: NEON COAST</title>
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #070514; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
      .boot-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 40%, #1c103b 0%, #070514 100%); color: #fff; gap: 10px;
      }
      .boot-title {
        font-size: 42px; font-weight: 900; font-style: italic; letter-spacing: -0.02em;
        background: linear-gradient(90deg, #ff2a85, #00f5ff); -webkit-background-clip: text; color: transparent;
      }
      .boot-sub { font-size: 12px; letter-spacing: 0.25em; color: #67e8f9; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-sub">VICE PROTOCOL</div>
        <div class="boot-title">NEON COAST</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:6px;">Entering live single-world city...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
